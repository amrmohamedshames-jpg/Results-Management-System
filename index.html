
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة النتائج</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4">
        نظام إدارة النتائج
    </h1>

    <!-- Student Form -->
    <div class="card p-4 shadow-sm mb-4">

        <h3 class="mb-3">إضافة طالب جديد</h3>

        <div class="mb-3">
            <label class="form-label">اسم الطالب</label>
            <input type="text" id="studentName"
                   class="form-control" placeholder="أدخل اسم الطالب">
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">درجة المادة الأولى</label>
                <input type="number" id="grade1"
                       class="form-control" placeholder="من 0 إلى 100">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">درجة المادة الثانية</label>
                <input type="number" id="grade2"
                       class="form-control" placeholder="من 0 إلى 100">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">درجة المادة الثالثة</label>
                <input type="number" id="grade3"
                       class="form-control" placeholder="من 0 إلى 100">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">نسبة الحضور</label>
                <input type="number" id="attendance"
                       class="form-control" placeholder="من 0 إلى 100">
            </div>

        </div>

        <button id="addStudentBtn" class="btn btn-primary w-100">
            إضافة طالب
        </button>

    </div>

    <!-- Error Messages -->
    <div id="errorBox" class="alert alert-danger d-none"
         role="alert"></div>

    <!-- Students List -->
    <div class="card p-4 shadow-sm mb-4">

        <h3 class="mb-3">قائمة الطلاب</h3>

        <div id="studentsListDisplay">
            <p class="text-muted">لم يتم إضافة أي طلاب حتى الآن.</p>
        </div>

    </div>

    <!-- Mercy Committee -->
    <div class="card p-4 shadow-sm mb-4">

        <h3 class="mb-3">لجنة الرأفة</h3>

        <button id="mercyBtn" class="btn btn-success w-100">
            تفعيل لجنة الرأفة
        </button>

        <div id="finalReport" class="mt-4"></div>

    </div>

</div>

<!-- JavaScript File --><script src="script.js" defer></script>
</body>
</html>
